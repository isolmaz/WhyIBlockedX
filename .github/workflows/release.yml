name: Release

# Every push to main runs CI. When manifest.json has a version without a GitHub
# release, the extension ZIP is uploaded to the Chrome Web Store and submitted
# for review (it goes live once review passes), then released here as v<version>.
# Needs the secrets CWS_SERVICE_ACCOUNT_KEY and CWS_PUBLISHER_ID.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  version:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(jq -r .version manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released; bump the version in manifest.json to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: version
    if: needs.version.outputs.new == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: chrome-web-store
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Release notes
        run: |
          awk -v v="$VERSION" '/^## /{p = index($0, "## " v " ") == 1; next} p' CHANGELOG.md > notes.md
          grep -q . notes.md || { echo "::error::CHANGELOG.md has no '## $VERSION ' section"; exit 1; }

      - name: Package
        run: |
          mkdir dist
          zip -r -X "dist/WhyIBlockedX-v$VERSION.zip" manifest.json _locales icons src -x '*.DS_Store'

      - name: Chrome Web Store
        env:
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: enmdpnmbnmmlnfchlbolggldjnmbappb
        run: node .github/ci/publish-cws.mjs "dist/WhyIBlockedX-v$VERSION.zip" "$VERSION"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "v$VERSION" dist/*.zip --target "$GITHUB_SHA" --title "WhyIBlockedX $VERSION" --notes-file notes.md
